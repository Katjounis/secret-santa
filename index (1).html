<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Secret Santa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1610;--parch:#f6ead0;--parch2:#ead6a8;--ink:#2b1d12;
  --red:#b3202a;--red2:#d43a44;--green:#1f5a3a;--gold:#d8a93b;--muted:#6b5640;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -5%,rgba(255,205,110,.38),transparent 55%),
    radial-gradient(circle at 10% 85%,rgba(255,90,120,.22),transparent 40%),
    radial-gradient(circle at 92% 60%,rgba(255,170,60,.16),transparent 38%),
    linear-gradient(180deg,#6d0d20 0%,#45091a 45%,#220812 100%) fixed;
  background-color:#3a0716;
  overflow-x:hidden;
}
canvas#snow,canvas#confetti{position:fixed;inset:0;pointer-events:none}
canvas#snow{z-index:0}
canvas#confetti{z-index:80}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:64px 16px 90px}
.garland{position:fixed;top:0;left:0;right:0;height:44px;z-index:55;pointer-events:none;display:flex;justify-content:space-around;overflow:hidden}
.garland::before{content:"";position:absolute;left:0;right:0;top:9px;border-top:2px solid #1b120c}
.garland span{position:relative;top:10px;width:11px;height:17px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);box-shadow:0 0 14px 4px var(--c);animation:blink 1.4s ease-in-out infinite alternate}
.garland span::before{content:"";position:absolute;top:-4px;left:2px;width:7px;height:5px;background:#3a2a1a;border-radius:2px}
.garland span:nth-child(odd){top:16px}
.garland span:nth-child(4n+1){--c:#ff4757}
.garland span:nth-child(4n+2){--c:#ffd32a;animation-delay:.35s}
.garland span:nth-child(4n+3){--c:#2ed573;animation-delay:.7s}
.garland span:nth-child(4n){--c:#4fa3ff;animation-delay:1.05s}
@keyframes blink{from{opacity:1}to{opacity:.25;box-shadow:none}}
body.admin main{max-width:900px}
h1,h2,.deco{font-family:'Cinzel Decorative',Georgia,serif;line-height:1.2}
h1{font-size:clamp(1.6rem,6vw,2.3rem);margin:.2em 0 .4em}
h2{font-size:1.2rem;margin:0 0 .7em;color:var(--red)}
p{margin:.6em 0}
.light{color:#f3e7cc}
.hero{text-align:center;margin-bottom:20px}
.fancy{font-size:clamp(1.1rem,5vw,1.5rem);color:#fff;letter-spacing:.04em}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;font-weight:900;color:var(--red)}
.kicker.light{color:var(--gold)}
.alias{font-family:'MedievalSharp',Georgia,serif;color:var(--green)}
.card{
  background:linear-gradient(160deg,var(--parch) 0%,var(--parch2) 100%);
  border-radius:16px;padding:22px 18px;margin:0 0 18px;
  box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 0 0 2px rgba(216,169,59,.55),inset 0 0 40px rgba(120,80,20,.12);
  animation:fadeUp .6s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.center{text-align:center}
.btn{
  font:inherit;font-weight:900;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;
  transition:transform .15s,opacity .2s,background .2s;display:inline-block;text-decoration:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 6px 0 #7a141b}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #9a7421}
.btn.ghost{background:#fffaf0;border:2px solid var(--ink);color:var(--ink)}
.btn.small{padding:8px 14px;font-size:.88rem;box-shadow:none}
.btn.big{font-size:1.15rem;padding:16px 30px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.fleeing{position:fixed;z-index:70;margin:0;transition:left .22s ease,top .22s ease,transform .15s;white-space:nowrap}
.btn.tired{background:#9b8d7a;color:#fff;border-color:#9b8d7a}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.tiny{font-size:.85rem;color:var(--muted)}
.name{color:var(--red);font-weight:900}
.taunt{min-height:1.5em;text-align:center;font-weight:900;color:var(--red);margin-top:10px}

/* père noël volant */
#santa{position:fixed;z-index:60;left:100vw;top:18vh;font-size:42px;white-space:nowrap;user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#santa.go{animation:fly linear forwards}
@keyframes fly{to{transform:translateX(calc(-100vw - 360px))}}
#santa .bob{display:inline-block;animation:bob .5s ease-in-out infinite alternate}
#santa.drunk .bob{animation:drunk 1.1s ease-in-out infinite}
@keyframes bob{to{transform:translateY(-10px) rotate(-3deg)}}
@keyframes drunk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-30px) rotate(-12deg)}75%{transform:translateY(25px) rotate(10deg)}}
#santa .sl{position:relative;display:inline-block}
#santa .sc{position:absolute;left:2px;top:-24px;font-size:32px}
#santa .bubble{
  position:absolute;bottom:calc(100% + 14px);left:40px;background:#fff;border-radius:14px;padding:6px 12px;
  font:900 13px 'Nunito',sans-serif;color:var(--ink);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35)
}
.dropgift{position:fixed;z-index:59;font-size:34px;pointer-events:none;animation:drop 1.4s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg)}}

/* règles, quiz */
.rule{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px dashed rgba(43,29,18,.25)}
.rule:first-of-type{border-top:0}
.rule .ico{font-size:1.7rem;line-height:1}
.rule h3{margin:0 0 4px;font-size:1rem;letter-spacing:.05em}
.opt{display:block;width:100%;margin:8px 0;text-align:left;border-radius:12px;padding:12px 14px;background:#fffaf0;border:2px solid rgba(43,29,18,.25);font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.opt.wrong{background:#ffd6d6;border-color:var(--red);animation:shake .45s}
.opt.right{background:#d5efd9;border-color:var(--green)}
.verdict{min-height:1.4em;font-weight:900;text-align:center}

/* coffre */
.gift{position:relative;width:180px;height:180px;margin:26px auto 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gift .box{position:absolute;bottom:0;left:12px;width:156px;height:112px;border-radius:8px;background:var(--red);
  background-image:linear-gradient(90deg,transparent 66px,var(--gold) 66px,var(--gold) 90px,transparent 90px);
  box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 14px 24px rgba(0,0,0,.4)}
.gift .lid{position:absolute;top:34px;left:0;width:180px;height:38px;border-radius:8px;background:var(--red2);
  background-image:linear-gradient(90deg,transparent 78px,var(--gold) 78px,var(--gold) 102px,transparent 102px);
  box-shadow:0 6px 10px rgba(0,0,0,.25);transition:transform .9s cubic-bezier(.2,.8,.3,1),opacity .9s}
.gift .lid::before,.gift .lid::after{content:"";position:absolute;top:-30px;width:46px;height:34px;border:9px solid var(--gold);border-radius:50% 50% 10% 50%}
.gift .lid::before{left:44px;transform:rotate(-20deg)}
.gift .lid::after{right:44px;transform:scaleX(-1) rotate(-20deg)}
.gift.shake{animation:shake .45s}
.gift.open .lid{transform:translateY(-170px) rotate(-30deg);opacity:0}
.gift.open .box{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes glow{to{box-shadow:0 0 60px 20px rgba(216,169,59,.8)}}
.drumtxt{min-height:3em;text-align:center;font-weight:900}

/* chargement */
.bar{height:22px;background:rgba(0,0,0,.12);border-radius:999px;overflow:hidden;margin:16px 0}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--red) 0 12px,#fff 12px 24px);transition:width .5s}
.steps{list-style:none;padding:0;margin:0;font-weight:800;font-size:.95rem}
.steps li{padding:4px 0;animation:fadeUp .3s both}
.steps li.ok::after{content:"  ✅"}

/* ticket à gratter */
.scratch{position:relative;margin:14px auto 6px;max-width:440px;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.scratch .under{padding:22px 10px;background:#fffaf0;text-align:center}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.target-name{font-family:'Cinzel Decorative',Georgia,serif;font-weight:900;color:var(--red);font-size:clamp(2.2rem,11vw,3.8rem);line-height:1.05;margin:.1em 0}
.target .alias{font-size:1.35rem}

/* produits */
.prods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.prod{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.pimg{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.ph{font-size:3rem}
.prod .pt{padding:8px 10px 2px;font-weight:800;font-size:.9rem;flex:1}
.prod .pp{padding:0 10px;color:var(--red);font-weight:900}
.prod .btn{margin:8px;text-align:center}
.notes{margin:0;padding-left:1.2em}
.notes li{margin:.35em 0}
.oracle,.motdoux{background:#fffaf0;border:2px dashed var(--gold);border-radius:14px;padding:16px;margin:12px 0;min-height:5em;transition:opacity .25s}
.oracle .who{font-family:'MedievalSharp',Georgia,serif;color:var(--green)}
.oracle .what{font-weight:900;font-size:1.05rem;margin:4px 0}
.oracle .price{font-size:.88rem;color:var(--muted)}
.motdoux{font-family:'MedievalSharp',Georgia,serif;font-size:1.15rem;text-align:center}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster li{background:rgba(255,255,255,.45);border-radius:10px;padding:8px 10px;font-size:.92rem}
.roster li b{display:block}
.roster li.me{outline:2px solid var(--gold)}
.count{font-family:'Cinzel Decorative',Georgia,serif;font-size:2.2rem;color:var(--green);text-align:center}
.final{text-align:center}
.final .deco{font-size:1.35rem;color:var(--red);margin-top:14px}
.proclam{font-family:'MedievalSharp',Georgia,serif;font-size:1.08rem}
.sound{position:fixed;top:52px;right:12px;z-index:75;width:44px;height:44px;border-radius:50%;border:0;background:rgba(246,234,208,.92);font-size:1.2rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}

/* admin */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;font-size:.85rem;font-weight:800;gap:4px}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=url],textarea{
  font:inherit;font-weight:400;font-size:16px;padding:9px 11px;border-radius:10px;border:1.5px solid rgba(43,29,18,.3);background:#fffaf0;color:var(--ink);width:100%}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;margin-top:10px}
.chk input{accent-color:var(--red);width:18px;height:18px}
.steps-help{margin:0;padding-left:1.3em}
.steps-help li{margin:.5em 0}
.person{background:rgba(255,255,255,.45);border-radius:12px;padding:12px;margin-bottom:14px}
.person-head{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center}
.person-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.person-sub label,.lbl{font-size:.78rem;font-weight:800;display:flex;flex-direction:column;gap:3px}
.num{font-family:'Cinzel Decorative',Georgia,serif;color:var(--red);text-align:center}
.x{border:0;background:var(--red);color:#fff;border-radius:50%;width:30px;height:30px;font-size:1.1rem;cursor:pointer;flex:none}
.idea{display:grid;grid-template-columns:64px 1fr 30px;gap:8px;align-items:start;background:#fff;border-radius:10px;padding:8px;margin-top:8px}
.thumb{width:64px;height:64px;border-radius:8px;background:#f3eee2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb .ph{font-size:1.8rem}
.idea-f{display:flex;flex-direction:column;gap:6px}
.idea-f .row2{display:grid;grid-template-columns:1fr 90px;gap:6px}
.idea-f input{padding:7px 9px}
.hint{font-size:.88rem;color:var(--muted)}
.warn{background:#fff1c9;border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-bottom:18px}
.res{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px dashed rgba(43,29,18,.25)}
.res-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.secret{font-weight:900;color:var(--red);transition:filter .2s}
.secret.blur{filter:blur(6px);user-select:none}
.flash{color:var(--green);font-weight:900;font-size:.85rem}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .person-head{grid-template-columns:24px 1fr 30px}
  .person-head input[data-k=alias]{grid-column:2/3}
  .person-sub{grid-template-columns:1fr}
  .roster{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<canvas id="confetti"></canvas>
<div class="garland" id="garland"></div>
<button id="soundBtn" class="sound" title="Son" hidden>🔊</button>
<main id="app"></main>

<script>
/* =========================================================
   OUTILS
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const fr = n => String(n).replace('.', ',');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const boldDigits = s => String(s).replace(/\d/g, d => String.fromCodePoint(0x1D7EC + Number(d)));
const fancyTitle = y => `🎅🆂🅴🅲🆁🅴🆃 🆂🅰🅽🆃🅰 ${boldDigits(y)}🎅`;

function render(html){
  $$('body > .btn.fleeing').forEach(b => b.remove());
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* Lien brouillé : le nom tiré n'est pas lisible dans l'URL */
const KEY = 'graal-kaamelott-noel';
function encode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach((b, i) => bin += String.fromCharCode(b ^ KEY.charCodeAt(i % KEY.length)));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  const bin = atob(str), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length);
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}

/* ---------- images produits (Amazon ou autre) ---------- */
function asinOf(u){
  u = u || '';
  for (let k = 0; k < 3; k++){ try { const d = decodeURIComponent(u); if (d === u) break; u = d; } catch(e){ break; } }
  const m = u.match(/(?:\/dp\/|\/gp\/product\/|\/gp\/aw\/d\/|\/product\/|\/d\/)([A-Z0-9]{10})(?:[/?&#]|$)/i);
  return m && /amazon|amzn/i.test(u) ? m[1].toUpperCase() : null;
}
function cleanUrl(u){
  const a = asinOf(u);
  if (a){ const host = (u.match(/amazon\.[a-z.]+/i) || ['amazon.fr'])[0]; return `https://www.${host}/dp/${a}`; }
  return (u || '').trim();
}
function imgCandidates(u, img){
  const c = [];
  if (img) c.push(img.trim());
  const a = asinOf(u);
  if (a){
    c.push(`https://images-na.ssl-images-amazon.com/images/P/${a}.01._SCLZZZZZZZ_SX400_.jpg`);
    c.push(`https://ws-eu.amazon-adsystem.com/widgets/q?_encoding=UTF8&ASIN=${a}&Format=_SL400_&ID=AsinImage&MarketPlace=FR&ServiceVersion=20070822&WS=1`);
  }
  return c;
}
function fillImg(box, u, img){
  const cands = imgCandidates(u, img);
  box.innerHTML = '<span class="ph">🎁</span>';
  if (!cands.length) return;
  const el = new Image();
  el.referrerPolicy = 'no-referrer';
  el.alt = '';
  let k = 0;
  const next = () => { if (k >= cands.length) return; el.src = cands[k++]; };
  el.onload = () => { if (el.naturalWidth < 30) next(); else { box.innerHTML = ''; box.appendChild(el); } };
  el.onerror = next;
  next();
}

/* =========================================================
   DÉCOR : guirlande, neige, confettis, son, voix, père noël
   ========================================================= */
(function garland(){
  const g = $('#garland'); const n = Math.max(10, Math.round(innerWidth / 42));
  g.innerHTML = '<span></span>'.repeat(n);
})();
(function snow(){
  const c = $('#snow'), ctx = c.getContext('2d');
  let W, H; const flakes = [];
  const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 90; i++) flakes.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.6+.6, s:Math.random()*.7+.3, d:Math.random()*6});
  (function loop(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const f of flakes){
      f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .4;
      if (f.y > H + 5){ f.y = -5; f.x = Math.random()*W; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

function confetti(){
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#b3202a','#d8a93b','#1f5a3a','#f6ead0','#d43a44','#3a7bd5'];
  const ps = [];
  for (let i = 0; i < 200; i++) ps.push({
    x:c.width/2+(Math.random()-.5)*80, y:c.height*.45, vx:(Math.random()-.5)*17, vy:-Math.random()*16-4,
    w:Math.random()*8+5, h:Math.random()*5+3, r:Math.random()*6, vr:(Math.random()-.5)*.3, col:pick(cols)
  });
  const t0 = performance.now();
  (function loop(t){
    ctx.clearRect(0,0,c.width,c.height);
    for (const p of ps){
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if (t - t0 < 4500) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}

let soundOn = true;
let AC = null;
function audio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} return AC; }
function drumroll(){
  if (!soundOn) return;
  const ac = audio(); if (!ac) return;
  const mk = (dur, pow) => {
    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, pow);
    return buf;
  };
  const snare = mk(.18, 3), crash = mk(1.8, 2);
  const play = (buf, time, vol, type, freq) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = type; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(time);
  };
  let t = ac.currentTime + .05, gap = .1; const end = t + 1.45;
  while (t < end){ play(snare, t, .25 + (t - ac.currentTime) * .2, 'bandpass', 1900); t += gap; gap = Math.max(.028, gap * .92); }
  play(crash, end + .05, .7, 'highpass', 4500);
  play(snare, end + .05, .9, 'lowpass', 180);
}
function boing(){
  if (!soundOn) return;
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(600, ac.currentTime); o.frequency.exponentialRampToValueAtTime(140, ac.currentTime + .25);
  g.gain.setValueAtTime(.25, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .3);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .3);
}
function say(txt, pitch = .5){
  if (!soundOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'fr-FR'; u.pitch = pitch; u.rate = .9;
    speechSynthesis.speak(u);
  } catch(e){}
}

const TAUNTS = [
  'Hop hop hop, où tu vas ?', 'Trop lent, manant !', 'T\'as les doigts gras de chips ?', 'Raté, gueux !',
  'Même Papy vise mieux', 'Ventrebleu, encore raté !', 'Essaie avec l\'autre main', 'Tu fatigues, maraud ?',
  'Plus vite, ça refroidit !', 'Pas aujourd\'hui, faquin', 'C\'est le pastis qui te fait trembler ?'
];
function makeFleeing(btn, {max = 7, finalText = 'Bon ok, t\'as gagné', onFinal, tauntEl} = {}){
  let n = 0, done = false;
  const flee = e => {
    if (done) return;
    if (e.pointerType === 'mouse' && e.type === 'pointerdown') {} // la souris fuit déjà au survol
    e.preventDefault(); e.stopPropagation();
    n++;
    boing();
    if (navigator.vibrate) navigator.vibrate(30);
    if (n >= max){
      done = true;
      btn.textContent = finalText;
      btn.classList.add('tired');
      return;
    }
    const r = btn.getBoundingClientRect();
    if (!btn.classList.contains('fleeing')){
      btn.style.left = r.left + 'px'; btn.style.top = r.top + 'px';
      btn.classList.add('fleeing'); document.body.appendChild(btn);
    }
    const t = pick(TAUNTS);
    if (tauntEl) tauntEl.textContent = t;
    const w = btn.offsetWidth, h = btn.offsetHeight;
    let x, y, tries = 0;
    do {
      x = 10 + Math.random() * Math.max(10, innerWidth - w - 20);
      y = 70 + Math.random() * Math.max(10, innerHeight - h - 140);
      tries++;
    } while (tries < 10 && Math.abs(x - r.left) < 90 && Math.abs(y - r.top) < 60);
    btn.style.left = x + 'px'; btn.style.top = y + 'px';
    btn.style.transform = `rotate(${(Math.random() - .5) * 20}deg)`;
  };
  btn.addEventListener('pointerdown', flee);
  btn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(e); });
  btn.addEventListener('click', e => { e.preventDefault(); if (done && onFinal) onFinal(); });
}

function setupScratch(onDone){
  const wrap = $('#scratch'), cv = $('canvas', wrap), ctx = cv.getContext('2d');
  const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr);
  const g = ctx.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, '#b8901f'); g.addColorStop(.5, '#f3d77a'); g.addColorStop(1, '#b8901f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = 0; i < 220; i++) ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 2, 2);
  ctx.fillStyle = '#4a320a'; ctx.textAlign = 'center';
  ctx.font = '900 20px Nunito, sans-serif'; ctx.fillText('🪙 GRATTE ICI, MARAUD 🪙', r.width / 2, r.height / 2 - 4);
  ctx.font = '700 13px Nunito, sans-serif'; ctx.fillText('100 % de chances de gagner un destin', r.width / 2, r.height / 2 + 18);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let down = false, last = null, done = false, moves = 0;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const finish = () => {
    if (done) return; done = true;
    cv.style.transition = 'opacity .6s'; cv.style.opacity = 0;
    setTimeout(() => cv.remove(), 650);
    onDone();
  };
  const check = () => {
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0, tot = 0;
    for (let i = 3; i < d.length; i += 4 * 37){ tot++; if (d[i] === 0) clear++; }
    if (clear / tot > .5) finish();
  };
  const scratch = (x, y) => {
    ctx.beginPath(); ctx.moveTo(...(last || [x, y])); ctx.lineTo(x + .1, y); ctx.stroke();
    last = [x, y];
    if (++moves % 6 === 0) check();
  };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); down = true; last = null; try { cv.setPointerCapture(e.pointerId); } catch(_){} scratch(...pos(e)); });
  cv.addEventListener('pointermove', e => { if (down && !done){ e.preventDefault(); scratch(...pos(e)); } });
  const up = () => { down = false; last = null; if (!done) check(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}

        <div class="idea-f">
          <input type="text" data-f="t" placeholder="Nom du cadeau" value="${esc(it.t)}">
          <input type="url" data-f="u" placeholder="Lien Amazon (ou autre site)" value="${esc(it.u)}">
          <div class="row2">
            <input type="url" data-f="img" placeholder="Adresse de l'image (si besoin)" value="${esc(it.img)}">
            <input type="text" data-f="p" placeholder="Prix" value="${esc(it.p)}">
          </div>
        </div>
        <button class="x" data-delidea="${j}" title="Retirer">×</button>
      </div>`).join('')}
    </div>
    <div style="margin-top:8px"><button class="btn ghost small" data-addidea="${i}">+ Ajouter un produit</button></div>
  </div>`).join('');
  $$('#people .person').forEach(pe => {
    const p = S.people[Number(pe.dataset.i)];
    $$('.idea', pe).forEach(ie => { const it = p.ideas[Number(ie.dataset.j)]; fillImg($('.thumb', ie), it.u, it.img); });
  });
}

function shuffle(a){
  const r = new Uint32Array(a.length); crypto.getRandomValues(r);
  for (let i = a.length - 1; i > 0; i--){ const j = r[i] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function draw(){
  const msg = $('#drawMsg');
  const P = S.people.filter(p => p.name.trim());
  const norm = s => (s || '').trim().toLowerCase();
  if (P.length < 3){ msg.textContent = 'Il faut au moins 3 courageux, sinon ce n\'est plus un secret.'; return; }
  const names = P.map(p => norm(p.name));
  if (new Set(names).size !== names.length){ msg.textContent = 'Deux courageux ont le même nom. Renomme-les, même le Père Noël s\'y perdrait.'; return; }
  if (S.pairs && !confirm('Relancer le tirage ? Si tu as déjà envoyé les liens, ils correspondent à l\'ancien tirage et il faudra tout renvoyer.')) return;
  const n = P.length;
  const ok = (i, j) => i !== j
    && !(norm(P[i].group) && norm(P[i].group) === norm(P[j].group))
    && !(norm(P[i].last) && norm(P[i].last) === norm(P[j].name));
  for (let a = 0; a < 20000; a++){
    const perm = shuffle([...Array(n).keys()]);
    let good = true;
    for (let i = 0; i < n; i++){
      if (!ok(i, perm[i]) || (S.cfg.noPairs && n > 2 && perm[perm[i]] === i)){ good = false; break; }
    }
    if (good){
      S.pairs = P.map((p, i) => [p.name.trim(), P[perm[i]].name.trim()]);
      save(); showPairs = false;
      msg.textContent = 'Tirage effectué ! Les parchemins sont prêts juste en dessous.';
      renderResults(); confetti(); drumroll();
      $('#results').scrollIntoView({behavior:'smooth'});
      return;
    }
  }
  msg.textContent = 'Impossible de trouver un tirage avec ces contraintes. Assouplis les groupes, l\'an dernier ou l\'option des duos.';
}

function renderResults(){
  const R = $('#results'); if (!R) return;
  if (!S.pairs){ R.hidden = true; return; }
  R.hidden = false;
  const byName = new Map(S.people.filter(p => p.name.trim()).map(p => [p.name.trim(), p]));
  if (S.pairs.some(([g, t]) => !byName.has(g) || !byName.has(t))){
    R.innerHTML = `<h2>Les parchemins</h2><p>Tu as renommé ou retiré quelqu'un depuis le tirage. Relance-le pour régénérer les liens.</p>`;
    return;
  }
  const c = S.cfg;
  const roster = [...byName.values()].map(p => [p.name.trim(), p.alias.trim()]);
  const base = location.href.split(/[?#]/)[0];
  links = S.pairs.map(([g, t]) => {
    const G = byName.get(g), T = byName.get(t);
    const payload = {
      v: 1, y: c.year, b: c.budget, d: c.date, l: (c.place || '').trim(), m: (c.master || '').trim(), s: (c.phone || '').trim(), w: (c.blessing || '').trim(),
      g: [G.name.trim(), G.alias.trim()], t: [T.name.trim(), T.alias.trim()],
      n: T.notes.split('\n').map(x => x.trim()).filter(Boolean),
      a: T.ideas.filter(x => (x.t || '').trim() || (x.u || '').trim()).map(x => [(x.t || '').trim(), cleanUrl(x.u), (x.img || '').trim(), (x.p || '').trim()]),
      r: roster
    };
    const link = base + '#' + encode(payload);
    return {G, T, link};
  });

  R.innerHTML = `
    <h2>Les parchemins</h2>
    <p class="hint">Chaque ligne = le lien perso d'une personne. Tu copies son lien et tu le colles dans votre conversation, c'est tout : en l'ouvrant, elle tombe sur la page avec la personne qu'elle doit gâter, tes idées, le mot de la fin, etc. « Tester » te montre exactement ce qu'elle verra. Si tu modifies une besace après coup, le lien change : renvoie-le.</p>
    <label class="chk"><input type="checkbox" id="showPairs" ${showPairs ? 'checked' : ''}> Afficher qui a tiré qui (le maître assume)</label>
    ${links.map((x, k) => `
      <div class="res">
        <div>
          <b>${esc(x.G.name)}</b> <span class="alias">${esc(x.G.alias)}</span>
          <div class="tiny">offre à <span class="secret ${showPairs ? '' : 'blur'}">${esc(x.T.name)}</span></div>
        </div>
        <div class="res-actions">
          <button class="btn primary small" data-act="copy" data-k="${k}">Copier le lien</button>
          <button class="btn ghost small" data-act="send" data-k="${k}">Partager</button>
          <a class="btn ghost small" href="${esc(x.link)}" target="_blank" rel="noopener">Tester</a>
          <span class="flash" id="fl${k}"></span>
        </div>
      </div>`).join('')}`;

  $('#showPairs').onchange = e => { showPairs = e.target.checked; $$('.secret', R).forEach(s => s.classList.toggle('blur', !showPairs)); };
  $$('[data-act]', R).forEach(btn => btn.onclick = async () => {
    const x = links[Number(btn.dataset.k)], fl = $('#fl' + btn.dataset.k);
    if (btn.dataset.act === 'send' && navigator.share){
      try { await navigator.share({url: x.link}); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
    const ok = await copyText(x.link);
    fl.textContent = ok ? 'Lien copié' : 'Copie impossible';
    setTimeout(() => fl.textContent = '', 2000);
  });
}

/* =========================================================
   AIGUILLAGE
   ========================================================= */
const h = location.hash.slice(1);
const params = new URLSearchParams(location.search);
if (h){
  let data = null;
  try { data = decode(h); } catch(e){}
  if (data && data.v === 1 && data.g && data.t) startReveal(data); else showBroken();
} else if (params.has('maitre')){
  startAdmin();
} else {
  showManant();
}
addEventListener('hashchange', () => location.reload());
</script>
